<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Socrarius System - Suite</title>
    <style>
        /* 🟣 全体背景＆サイバーSAOスタイル */
        body {
            margin: 0;
            padding: 20px 0;
            background-color: #0c1425;
            background-image: url("https://socrarius-tool.com/converter/back.webp");
            background-attachment: fixed; /* 背景を固定してスクロールずれを防止 */
            background-size: cover;
            color: #e0d0ff;
            font-family: 'Segoe UI', Consolas, monospace;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: flex-start;
            min-height: 90vh;
        }

        /* 🌸 Cloudiaさん ＆ ナビゲーションボタン統合ヘッダー 🌸 */
        .header-container {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 20px;
            margin: 10px auto 20px auto;
            max-width: 850px;
            width: 92vw;
            flex-wrap: wrap; /* スマホ表示用調整 */
        }

        .cloudia {
            text-align: center;
        }

        .cloudia img {
            border-radius: 14px; 
            width: auto; 
            height: 140px; 
            border: 3px solid rgba(147, 112, 219, 0.6); 
            box-shadow: 0 0 20px rgba(147, 112, 219, 0.5), 0 0 40px rgba(138, 43, 226, 0.25);
            display: block;
        }

        /* 右側に並ぶサイバーナビゲーションボタン群 */
        .nav-button-group {
            display: flex;
            flex-direction: column;
            gap: 10px;
            justify-content: center;
        }

        .nav-btn {
            padding: 10px 20px ;
            background: rgba(20, 8, 35, 0.85);
            border: 1px solid #ba55d3;
            border-radius: 6px;
            color: #b19cd9;
            font-size: 0.9rem;
            /*font-weight: bold;*/
            letter-spacing: 1px;
            cursor: pointer;
            transition: all 0.3s ease;
            box-shadow: 0 0 8px rgba(138, 43, 226, 0.3);
            text-align: left;
            min-width: 220px;
        }

        .nav-btn:hover {
            background: rgba(138, 43, 226, 0.4);
            color: #00ffcc;
            border-color: #00ffcc;
            box-shadow: 0 0 12px rgba(0, 255, 204, 0.5);
            transform: translateX(4px);
        }

        /* アクティブな（選択中の）ボタンデザイン */
        .nav-btn.active {
            background: linear-gradient(135deg, #4b0082, #8a2be2);
            color: #ffffff;
            border-color: #00ffcc;
            box-shadow: 0 0 15px rgba(0, 255, 204, 0.7);
            text-shadow: 0 0 5px rgba(0, 255, 204, 0.8);
        }

        /* 🟣 ツールカード基本定義 */
        .converter-card {
            width: 640px;
            max-width: 92vw;
            background: rgba(20, 8, 35, 0.85);
            border: 2px solid #9370db;
            border-radius: 12px;
            padding: 25px;
            box-shadow: 0 0 20px rgba(147, 112, 219, 0.4), inset 0 0 10px rgba(147, 112, 219, 0.2);
            margin-bottom: 25px;
            display: none; /* ★初期はJSで指定したもの以外非表示 */
        }

        /* ★アクティブなカードのみふわっと表示 */
        .converter-card.active-panel {
            display: block;
            animation: fadeIn 0.4s ease;
        }

        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(8px); }
            to { opacity: 1; transform: translateY(0); }
        }

        .header-title {
            text-align: center;
            font-size: 1.4rem;
            letter-spacing: 3px;
            color: #d8bfd8;
            margin-top: 0;
            margin-bottom: 20px;
            text-shadow: 0 0 8px rgba(216, 191, 216, 0.8);
            border-bottom: 1px solid rgba(177, 156, 217, 0.3);
            padding-bottom: 10px;
        }

        .field-group {
            margin-bottom: 20px;
        }

        label {
            display: block;
            font-size: 0.85rem;
            color: #b19cd9;
            margin-bottom: 8px;
            letter-spacing: 1px;
        }

        /* 🟣 テキストエリア */
        textarea {
            width: 100%;
            height: 120px;
            background: rgba(10, 3, 18, 0.5);
            border: 1px solid #ba55d3;
            border-radius: 6px;
            color: #00ffcc;
            font-family: 'Consolas', monospace;
            font-size: 0.95rem;
            padding: 12px;
            box-sizing: border-box;
            resize: vertical;
            outline: none;
            box-shadow: inset 0 0 8px rgba(0, 0, 0, 0.8);
            transition: border-color 0.3s, box-shadow 0.3s;
        }

        textarea:focus {
            border-color: #00ffcc;
            box-shadow: 0 0 12px rgba(0, 255, 204, 0.4);
        }

        /* 🌸 カウンター表示 */
        .char-count-box {
            display: flex;
            justify-content: space-around;
            background: rgba(10, 3, 18, 0.7);
            border: 1px solid rgba(186, 85, 211, 0.4);
            border-radius: 6px;
            padding: 10px;
            margin-bottom: 20px;
            box-shadow: inset 0 0 5px rgba(0, 0, 0, 0.5);
        }

        .count-item {
            text-align: center;
            font-size: 0.8rem;
            color: #b19cd9;
            letter-spacing: 1px;
        }

        .count-value {
            display: block;
            font-size: 1.2rem;
            font-weight: bold;
            color: #00ffcc;
            text-shadow: 0 0 6px rgba(0, 255, 204, 0.6);
            margin-top: 2px;
        }

        /* コピーボタン */
        .btn-copy {
            display: block; /* ★これを追加 */
            width: 60%;
            margin: 0 auto; /* 左右のマージンを自動調整 */
            padding: 12px;
            background: linear-gradient(135deg, #4b008280, #8a2be280);
            border: 1px solid #ba55d3;
            border-radius: 6px;
            color: #ffffff;
            font-size: 1rem;
            font-weight: bold;
            letter-spacing: 2px;
            cursor: pointer;
            transition: all 0.3s ease;
            box-shadow: 0 0 10px rgba(138, 43, 226, 0.4);
        }

        .btn-copy:hover {
            background: linear-gradient(135deg, #6a0dad, #9932cc);
            box-shadow: 0 0 18px rgba(186, 85, 211, 0.8);
            transform: translateY(-2px);
        }

        .toast {
            text-align: center;
            height: 20px;
            margin-top: 10px;
            font-size: 0.85rem;
            color: #00ffcc;
            opacity: 0;
            transition: opacity 0.4s ease;
        }

        .toast.show {
            opacity: 1;
        }

        /* 🌸 DIFF INSPECTOR スタイル 🌸 */
        .diff-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 15px;
            margin-bottom: 20px;
        }

        .diff-textarea {
            height: 150px;
        }

        .diff-output-container {
            background: rgba(5, 1, 10, 0.85);
            border: 1px solid #00ffcc;
            border-radius: 6px;
            padding: 15px;
            font-family: 'Consolas', monospace;
            font-size: 0.9rem;
            line-height: 1.5;
            white-space: pre-wrap;
            word-break: break-all;
            max-height: 300px;
            overflow-y: auto;
            box-shadow: inset 0 0 10px rgba(0, 0, 0, 0.9);
            color: #a0a0a0;
        }

        .diff-added {
            background-color: rgba(0, 255, 204, 0.25);
            color: #00ffcc;
            font-weight: bold;
            border-radius: 3px;
            padding: 0 3px;
        }

        .diff-removed {
            background-color: rgba(255, 0, 100, 0.3);
            color: #ff3377;
            text-decoration: line-through;
            font-weight: bold;
            border-radius: 3px;
            padding: 0 3px;
        }

        .diff-summary {
            font-size: 0.85rem;
            color: #b19cd9;
            margin-bottom: 8px;
            display: flex;
            gap: 15px;
        }

        .diff-summary span {
            font-weight: bold;
        }
    </style>
</head>
<body>

    <div class="header-container">
        <div class="cloudia">
            <img src="https://socrarius-tool.com/converter/cloudia.webp" alt="Cloudia">
        </div>
        
        <div class="nav-button-group">
            <button class="nav-btn active" id="btn-diff" onclick="switchTab('panel-diff', 'btn-diff')">CODE DIFF INSPECTOR</button>
            <button class="nav-btn" id="btn-seq" onclick="switchTab('panel-seq', 'btn-seq')">SEQUENCE GENERATOR</button>
            <button class="nav-btn" id="btn-upper" onclick="switchTab('panel-upper', 'btn-upper')">UPPERCASE CONVERTER</button>
        </div>
    </div>

    <div id="panel-diff" class="converter-card active-panel">
        <div class="header-title">SYSTEM CODE: CODE DIFF INSPECTOR</div>

        <div class="diff-grid">
            <div>
                <label>▼ OLD CODE (比較元の古いコード)</label>
                <textarea id="oldCode" class="diff-textarea" placeholder="Paste OLD code here..." oninput="compareCodes()"></textarea>
            </div>
            <div>
                <label>▼ NEW CODE (比較先の新しいコード)</label>
                <textarea id="newCode" class="diff-textarea" placeholder="Paste NEW code here..." oninput="compareCodes()"></textarea>
            </div>
        </div>

        <div class="field-group">
            <div class="diff-summary">
                <span>▼ DIFFERENCE DETECTED (差分ハイライト結果):</span>
                <span style="color:#00ffcc;">■ 追加/変更 (Green)</span>
                <span style="color:#ff3377;">■ 削除 (Pink)</span>
            </div>
            <div id="diffViewer" class="diff-output-container">Paste codes above to detect differences...</div>
        </div>
    </div>

    <div id="panel-seq" class="converter-card">
        <div class="header-title">SYSTEM CODE: SEQUENCE GENERATOR</div>

        <div style="display: grid; grid-template-columns: 1fr 1fr 1fr; gap: 10px; margin-bottom: 15px;">
            <div>
                <label>▼ 生成行数 (COUNT)</label>
                <input type="number" id="seqCount" value="10" min="1" max="1000" style="width:100%; background:rgba(10,3,18,0.5); border:1px solid #ba55d3; border-radius:6px; color:#00ffcc; padding:8px; box-sizing:border-box; font-family:'Consolas',monospace;">
            </div>
            <div>
                <label>▼ 開始番号 (START)</label>
                <input type="number" id="seqStart" value="1" min="0" style="width:100%; background:rgba(10,3,18,0.5); border:1px solid #ba55d3; border-radius:6px; color:#00ffcc; padding:8px; box-sizing:border-box; font-family:'Consolas',monospace;">
            </div>
            <div>
                <label>▼ 加算モード (MODE)</label>
                <select id="seqMode" style="width:100%; background:rgba(10,3,18,0.5); border:1px solid #ba55d3; border-radius:6px; color:#00ffcc; padding:8px; box-sizing:border-box; font-family:'Consolas',monospace;">
                    <option value="all">全数字を加算 (+1)</option>
                    <option value="last">最後の数字のみ加算</option>
                </select>
            </div>
        </div>

        <div class="field-group">
            <label>▼ 雛形テンプレート (TEMPLATE TEXT)</label>
            <textarea id="seqTemplate" style="height: 70px;" placeholder="例: .photo1 { background: url('photo1.webp') center/cover no-repeat; }" oninput="generateSequence()"></textarea>
        </div>

        <div class="field-group">
            <label>▼ 生成結果 (GENERATED SEQUENCE)</label>
            <textarea id="seqResult" readonly style="height: 150px;" placeholder="ここに連番コードが爆速生成されます..."></textarea>
        </div>

        <button class="btn-copy" onclick="copySequenceToClipboard()">GENERATED CODE COPY TO CLIPBOARD</button>
    </div>

    <div id="panel-upper" class="converter-card">
        <div class="header-title">SYSTEM CODE: UPPERCASE CONVERTER</div>

        <div class="field-group">
            <label>▼ INPUT (Original Text / Multiple Lines Allowed)</label>
            <textarea id="inputText" placeholder="Type or paste text here... (e.g. Cloudia Magic)" oninput="convertToUpper()"></textarea>
        </div>

        <div class="field-group">
            <label>▼ OUTPUT (ALL UPPERCASE / Auto Converted)</label>
            <textarea id="outputText" readonly placeholder="UPPERCASE RESULT WILL APPEAR HERE..."></textarea>
        </div>

        <div class="char-count-box">
            <div class="count-item">
                CHARS (WITH SPACE)
                <span class="count-value" id="charWithSpace">0</span>
            </div>
            <div class="count-item">
                CHARS (NO SPACE)
                <span class="count-value" id="charNoSpace">0</span>
            </div>
            <div class="count-item">
                LINES
                <span class="count-value" id="lineCount">0</span>
            </div>
        </div>

        <button class="btn-copy" onclick="copyToClipboard()">COPY TO CLIPBOARD</button>
        <div class="toast" id="toastMsg">SYSTEM: COPIED TO CLIPBOARD!</div>
    </div>

<script>
    // 🌸 0. ★タブ切替＆button.mp3再生ロジック魔法
    function switchTab(panelId, btnId) {
        // ★ button.mp3 の再生（ボタンクリック効果音）
        const buttonAudio = new Audio("button.mp3");
        buttonAudio.play().catch(e => console.log("Button audio error:", e));

        // 全カードの非表示
        document.querySelectorAll('.converter-card').forEach(card => {
            card.classList.remove('active-panel');
        });

        // 全ボタンのアクティブ解除
        document.querySelectorAll('.nav-btn').forEach(btn => {
            btn.classList.remove('active');
        });

        // 指定のカード＆ボタンをアクティブ化
        document.getElementById(panelId).classList.add('active-panel');
        document.getElementById(btnId).classList.add('active');
    }

    // 🌸 1. 大文字変換＆文字数カウント関数
    function convertToUpper() {
        const input = document.getElementById("inputText").value;
        document.getElementById("outputText").value = input.toUpperCase();

        const countWithSpace = input.length;
        const countNoSpace = input.replace(/\s/g, "").length;
        const lines = input ? input.split("\n").length : 0;

        document.getElementById("charWithSpace").textContent = countWithSpace.toLocaleString();
        document.getElementById("charNoSpace").textContent = countNoSpace.toLocaleString();
        document.getElementById("lineCount").textContent = lines.toLocaleString();
    }

    // 🌸 2. ワンタップでコピーする関数
    function copyToClipboard() {
        const outputText = document.getElementById("outputText");
        if (!outputText.value) return;

        const audio = new Audio("cyber-.mp3"); 
        audio.play().catch(e => console.log("Audio play error:", e));

        navigator.clipboard.writeText(outputText.value).then(() => {
            const toast = document.getElementById("toastMsg");
            toast.classList.add("show");
            setTimeout(() => {
                toast.classList.remove("show");
            }, 2000);
        });
    }

    // 🌸 3. 超軽量・行単位の差分高速検出ロジック
    function compareCodes() {
        const oldText = document.getElementById("oldCode").value;
        const newText = document.getElementById("newCode").value;
        const viewer = document.getElementById("diffViewer");

        if (!oldText && !newText) {
            viewer.innerHTML = "Paste codes above to detect differences...";
            return;
        }

        const oldLines = oldText.split("\n");
        const newLines = newText.split("\n");

        let resultHtml = "";
        const maxLines = Math.max(oldLines.length, newLines.length);

        for (let i = 0; i < maxLines; i++) {
            const oldLine = oldLines[i];
            const newLine = newLines[i];

            if (oldLine === newLine) {
                if (newLine !== undefined) {
                    resultHtml += escapeHtml(newLine) + "\n";
                }
            } else {
                if (oldLine !== undefined) {
                    resultHtml += `<span class="diff-removed">- ${escapeHtml(oldLine)}</span>\n`;
                }
                if (newLine !== undefined) {
                    resultHtml += `<span class="diff-added">+ ${escapeHtml(newLine)}</span>\n`;
                }
            }
        }

        viewer.innerHTML = resultHtml || "完全一致（差分なし）";
    }

    // エスケープ処理
    function escapeHtml(str) {
        return str
            .replace(/&/g, "&amp;")
            .replace(/</g, "&lt;")
            .replace(/>/g, "&gt;")
            .replace(/"/g, "&quot;")
            .replace(/'/g, "&#039;");
    }

    // 🌸 4. 連番テキスト大量自動生成魔法
    function generateSequence() {
        const template = document.getElementById("seqTemplate").value;
        const count = parseInt(document.getElementById("seqCount").value) || 10;
        const start = parseInt(document.getElementById("seqStart").value) || 1;
        const mode = document.getElementById("seqMode").value;
        const resultArea = document.getElementById("seqResult");

        if (!template) {
            resultArea.value = "";
            return;
        }

        let outputLines = [];

        for (let i = 0; i < count; i++) {
            let currentLine = template;
            
            if (mode === "all") {
                currentLine = currentLine.replace(/\d+/g, (match) => {
                    const baseNum = parseInt(match);
                    return baseNum + i;
                });
            } else if (mode === "last") {
                const matches = [...currentLine.matchAll(/\d+/g)];
                if (matches.length > 0) {
                    const lastMatch = matches[matches.length - 1];
                    const baseNum = parseInt(lastMatch[0]);
                    const newNum = baseNum + i;
                    const index = lastMatch.index;
                    currentLine = currentLine.substring(0, index) + newNum + currentLine.substring(index + lastMatch[0].length);
                }
            }

            outputLines.push(currentLine);
        }

        resultArea.value = outputLines.join("\n");
    }

    document.getElementById("seqCount").addEventListener("input", generateSequence);
    document.getElementById("seqStart").addEventListener("input", generateSequence);
    document.getElementById("seqMode").addEventListener("change", generateSequence);

    // 連番コピー用（ケンくんの教材用コメントアウトもしっかり継承！）
    function copySequenceToClipboard() {
        const seqResult = document.getElementById("seqResult");
        if (!seqResult.value) return;

        const audio = new Audio("cyber-.mp3"); 
        audio.play().catch(e => console.log("Audio play error:", e));

        navigator.clipboard.writeText(seqResult.value).then(() => {
            //alert("SYSTEM: 連番コードをクリップボードにコピーしました！");//アミちゃん、このアラートはいらないから消したよ
        });
    }
</script>

</body>
</html>
